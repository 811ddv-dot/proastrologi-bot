name: Daily horoscope

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only (no Telegram messages)"
        type: boolean
        default: true
      preview_date:
        description: "Date for preview in YYYY-MM-DD (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-horoscope
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: horoscope-state
          key: horoscope-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: horoscope-history-
      - name: Generate and validate all 12 forecasts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PROASTROLOGI }}
          TELEGRAM_CHANNEL: "@proastrologi"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PREVIEW: ${{ inputs.preview }}
          PREVIEW_DATE: ${{ inputs.preview_date }}
        run: |
          if [ "$PREVIEW" = "true" ]; then
            if [ -n "$PREVIEW_DATE" ]; then
              python daily_horoscope.py --preview --date "$PREVIEW_DATE"
            else
              python daily_horoscope.py --preview
            fi
          else
            python daily_horoscope.py
          fi
      - name: Preserve publication history
        if: success() && github.event.inputs.preview != 'true'
        uses: actions/cache/save@v4
        with:
          path: horoscope-state
          key: horoscope-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save readable preview
        if: success() && github.event.inputs.preview == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: horoscope-preview
          path: preview.md
