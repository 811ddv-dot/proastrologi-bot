name: Check MAX connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Test pipeline without paid requests
        run: python3 -m unittest -q
      - name: Verify production MAX client and channel
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import max_delivery as mx
          me = mx.request('/me')
          assert me['username'] == mx.BOT_USERNAME
          member = mx.request(f'/chats/{mx.CHANNEL_ID}/members/me')
          assert member['is_admin'] and 'write' in member['permissions']
          print('Production MAX client: verified bot, channel, write permission. No publication.')
          PY
      - name: Verify bot and discover channel events (no publication)
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, urllib.request, urllib.error
          token = os.environ.get('MAX_BOT_TOKEN', '').strip()
          if not token:
              raise SystemExit('MAX_BOT_TOKEN is missing')
          with urllib.request.urlopen('https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer', timeout=30) as response:
              ca = response.read().decode('ascii')
          context = ssl.create_default_context(cadata=ca)
          def get(path):
              req = urllib.request.Request('https://platform-api2.max.ru' + path,
                  headers={'Authorization': token})
              try:
                  with urllib.request.urlopen(req, timeout=30, context=context) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit('MAX HTTP ' + str(exc.code)) from None
              except urllib.error.URLError as exc:
                  raise SystemExit('MAX connection: ' + str(exc.reason)) from None
              except TimeoutError:
                  raise SystemExit('MAX connection timeout') from None
          me = get('/me')
          print('Bot:', me.get('username'), 'ID:', me.get('user_id'))
          if me.get('username', '').lstrip('@') != 'id400406889818_bot':
              raise SystemExit('Unexpected bot: refusing further requests')
          data = get('/updates?timeout=0&limit=100')
          ids = set()
          for event in data.get('updates', []):
              cid = event.get('chat_id')
              if cid is None:
                  cid = event.get('message', {}).get('recipient', {}).get('chat_id')
              if cid is not None:
                  ids.add(cid)
          found = False
          for cid in sorted(ids):
              chat = get('/chats/' + str(cid))
              if chat.get('type') == 'channel':
                  member = get('/chats/' + str(cid) + '/members/me')
                  print('Channel:', json.dumps({'chat_id': cid, 'title': chat.get('title'),
                        'is_admin': member.get('is_admin'),
                        'permissions': member.get('permissions')}, ensure_ascii=False))
                  found = True
          if not found:
              print('No channel events available. Channel ID still required.')
          print('No messages sent; no generation requested.')
          PY
