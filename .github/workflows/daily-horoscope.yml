name: Daily horoscope

on:
  # cron-job.org dispatches daily at 21:00 Europe/Moscow; production starts September 25.
  workflow_dispatch:
    inputs:
      publication_test:
        description: "One-time authorized September 23 tests"
        type: choice
        options: ["none", "saved24", "full25"]
        default: "none"
      maintenance:
        description: "Migrate/check history and test private alerts (no generation or publication)"
        type: boolean
        default: false
      preview:
        description: "Preview only (no Telegram messages)"
        type: boolean
        default: true
      preview_date:
        description: "Date for preview in YYYY-MM-DD (default: tomorrow in Moscow)"
        type: string
        default: ""
      preview_days:
        description: "Consecutive preview days (test history only)"
        type: choice
        options: ["1", "3"]
        default: "1"
      preview_model:
        description: "Model for preview only (scheduled model is unchanged)"
        type: choice
        options: ["gpt-5-mini", "gpt-5.4"]
        default: "gpt-5.4"

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-horoscope
  cancel-in-progress: false

jobs:
  publish:
    # Owner approved Mail summaries for daily production on September 25.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Test editorial pipeline without API calls
        run: python -m unittest -v
      - uses: actions/cache/restore@v4
        with:
          path: horoscope-state
          key: horoscope-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: horoscope-history-
      - name: Restore durable history (migrate existing cache if needed)
        id: history
        env:
          GH_HISTORY_TOKEN: ${{ github.token }}
        run: python history_store.py restore
      - name: Test private alert delivery
        if: inputs.maintenance == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PROASTROLOGI }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python notify_admin.py --test
      - name: Download approved immutable September 24 preview
        if: inputs.publication_test == 'saved24'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35791462685
          artifact-ids: 10722541206
          path: approved-preview
          merge-multiple: true
      - name: Generate and validate all 12 forecasts
        if: inputs.maintenance != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PROASTROLOGI }}
          TELEGRAM_CHANNEL: "@proastrologi"
          MAX_ENABLED: "true"
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_HISTORY_TOKEN: ${{ github.token }}
          DURABLE_GENERATION: "true"
          PRODUCTION_START_DATE: "2026-09-25"
          PREVIEW: ${{ inputs.preview }}
          PUBLICATION_TEST: ${{ inputs.publication_test }}
          PREVIEW_DATE: ${{ inputs.preview_date }}
          PREVIEW_DAYS: ${{ inputs.preview_days || '1' }}
          OPENAI_MODEL: "gpt-5.4"
          PREVIEW_MODEL: ${{ inputs.preview_model || 'gpt-5.4' }}
        run: |
          if [ "$PUBLICATION_TEST" = "saved24" ] || [ "$PUBLICATION_TEST" = "full25" ]; then
            if [ "$PREVIEW" = "true" ]; then
              echo "Publication test requires preview=false"
              exit 1
            fi
            python publication_test.py "$PUBLICATION_TEST"
          elif [ "$PREVIEW" = "true" ]; then
            export OPENAI_MODEL="$PREVIEW_MODEL"
            if [ -n "$PREVIEW_DATE" ]; then
              python mail_production.py --preview --date "$PREVIEW_DATE"
            else
              python mail_production.py --preview
            fi
          else
            python mail_production.py
          fi
      - name: Save durable publication history
        if: always() && steps.history.outcome == 'success' && inputs.preview != true && inputs.maintenance != true
        env:
          GH_HISTORY_TOKEN: ${{ github.token }}
        run: python history_store.py save
      - name: Preserve backup history
        if: always() && steps.history.outcome == 'success' && inputs.preview != true && inputs.maintenance != true
        uses: actions/cache/save@v4
        with:
          path: horoscope-state
          key: horoscope-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Send private publication cost and editing report
        if: success() && inputs.preview != true && inputs.maintenance != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PROASTROLOGI }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -f publication-report.json ]; then
            python notify_admin.py --report
          fi
      - name: Save readable preview
        if: always() && inputs.preview == true && inputs.maintenance != true
        uses: actions/upload-artifact@v4
        with:
          name: horoscope-preview
          path: |
            preview.md
            preview-data.json
            preview-report.md
            preview-post-*.txt
            preview-post-*.html
      - name: Notify owner on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PROASTROLOGI }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python notify_admin.py
